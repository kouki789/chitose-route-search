<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Kaku Gothic ProN','YuGothic','Meiryo',sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#f9f9fb"/>
  <!-- Header bar -->
  <rect width="800" height="54" fill="#131e29"/>
  <text x="24" y="36" font-size="16" font-weight="800" fill="white">千歳ルート</text>
  <text x="107" y="36" font-size="16" font-weight="800" fill="#6366f1">検索</text>

  <!-- STEP badge -->
  <rect x="340" y="72" width="120" height="24" rx="12" fill="rgba(99,102,241,0.12)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 2 / 6</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" font-size="22" font-weight="900" fill="#111">出発地 / 目的地を入力する</text>

  <!-- Input mode tabs (centered, 480px wide → x=160) -->
  <!-- Tab 1: 手入力 (active) -->
  <rect x="160" y="145" width="148" height="44" rx="8" fill="#6366f1"/>
  <text x="234" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="white">✏️ 手入力</text>

  <!-- Tab 2: 現在地 -->
  <rect x="316" y="145" width="148" height="44" rx="8" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <text x="390" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#888">📍 現在地</text>

  <!-- Tab 3: リスト -->
  <rect x="472" y="145" width="148" height="44" rx="8" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <text x="546" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#888">📋 リスト</text>

  <!-- Label -->
  <text x="162" y="212" font-size="13" font-weight="600" fill="#555">出発地を入力</text>

  <!-- Input field -->
  <rect x="160" y="220" width="460" height="48" rx="10" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <text x="182" y="250" font-size="12" fill="#bbb">例: 札幌駅、中央区北1条西2丁目</text>

  <!-- 3 annotation cards -->
  <!-- Card 1: 手入力 -->
  <rect x="68" y="292" width="200" height="110" rx="12" fill="white" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="68" y="292" width="200" height="6" rx="3" fill="#6366f1"/>
  <text x="168" y="328" text-anchor="middle" font-size="22">✏️</text>
  <text x="168" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#333">手入力</text>
  <text x="168" y="372" text-anchor="middle" font-size="11.5" fill="#555">駅名・地名・住所を直接入力</text>
  <text x="168" y="389" text-anchor="middle" font-size="10.5" fill="#aaa">（例: 札幌駅 / 中央区北1条）</text>

  <!-- Card 2: 現在地 -->
  <rect x="300" y="292" width="200" height="110" rx="12" fill="white" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="300" y="292" width="200" height="6" rx="3" fill="#22c55e"/>
  <text x="400" y="328" text-anchor="middle" font-size="22">📍</text>
  <text x="400" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#333">現在地</text>
  <text x="400" y="372" text-anchor="middle" font-size="11.5" fill="#555">GPSで現在地を自動取得</text>
  <text x="400" y="389" text-anchor="middle" font-size="10.5" fill="#aaa">（位置情報の許可が必要）</text>

  <!-- Card 3: リスト -->
  <rect x="532" y="292" width="200" height="110" rx="12" fill="white" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="532" y="292" width="200" height="6" rx="3" fill="#f59e0b"/>
  <text x="632" y="328" text-anchor="middle" font-size="22">📋</text>
  <text x="632" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#333">リスト</text>
  <text x="632" y="372" text-anchor="middle" font-size="11.5" fill="#555">北海道の駅・地名から選択</text>
  <text x="632" y="389" text-anchor="middle" font-size="10.5" fill="#aaa">（地域→駅の順に選択）</text>

  <!-- Bottom note -->
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#bbb">タブをタップして入力方法を切り替えられます</text>
</svg>
