<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Kaku Gothic ProN','YuGothic','Meiryo',sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#f4f4ff"/>
  <!-- Header bar -->
  <rect width="800" height="54" fill="#131e29"/>
  <text x="24" y="36" font-size="16" font-weight="800" fill="white">千歳ルート</text>
  <text x="107" y="36" font-size="16" font-weight="800" fill="#6366f1">検索</text>

  <!-- STEP badge -->
  <rect x="340" y="72" width="120" height="24" rx="12" fill="rgba(99,102,241,0.12)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 6 / 6</text>

  <!-- Title -->
  <text x="400" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#111">Discord Bot でも使える</text>

  <!-- Discord card -->
  <rect x="100" y="135" width="600" height="145" rx="16" fill="white" stroke="#e0e0f5" stroke-width="1.5"/>

  <!-- Bot icon -->
  <text x="148" y="222" text-anchor="middle" font-size="44">🤖</text>

  <!-- Text content -->
  <text x="190" y="168" font-size="16" font-weight="800" fill="#222">Discord Bot でも使えます</text>
  <text x="190" y="190" font-size="11.5" fill="#555">このサイトと同じルート検索ロジックを搭載した Discord Bot があります。</text>
  <text x="190" y="207" font-size="11.5" fill="#555">サーバーに追加すると</text>
  <!-- /route code -->
  <rect x="310" y="195" width="60" height="18" rx="4" fill="#f0f0ff"/>
  <text x="312" y="208" font-size="11" fill="#5865f2" font-weight="600">/route</text>
  <text x="372" y="207" font-size="11.5" fill="#555"> ・</text>
  <rect x="385" y="195" width="68" height="18" rx="4" fill="#f0f0ff"/>
  <text x="387" y="208" font-size="11" fill="#5865f2" font-weight="600">/return</text>
  <text x="455" y="207" font-size="11.5" fill="#555"> コマンドで使えます</text>
  <text x="190" y="227" font-size="11" fill="#888">ページ下部のボタンからサーバーに追加できます</text>

  <!-- Discord button -->
  <rect x="500" y="238" width="172" height="38" rx="10" fill="#5865f2"/>
  <!-- Discord logo (simplified) -->
  <text x="524" y="262" font-size="14" fill="white">◎</text>
  <text x="542" y="262" font-size="13" font-weight="700" fill="white">Discord に追加する</text>

  <!-- Command examples -->
  <rect x="100" y="298" width="288" height="120" rx="12" fill="white" stroke="#e0e0f5" stroke-width="1.5"/>
  <text x="244" y="324" text-anchor="middle" font-size="13" font-weight="800" fill="#333">往路コマンド</text>
  <!-- Command box -->
  <rect x="120" y="332" width="248" height="36" rx="8" fill="#f5f5ff"/>
  <text x="134" y="354" font-size="12.5" fill="#5865f2" font-weight="600">/route 札幌駅</text>
  <text x="120" y="397" font-size="11" fill="#555">→ 出発駅から大学までのルートを表示</text>

  <rect x="412" y="298" width="288" height="120" rx="12" fill="white" stroke="#e0e0f5" stroke-width="1.5"/>
  <text x="556" y="324" text-anchor="middle" font-size="13" font-weight="800" fill="#333">復路コマンド</text>
  <!-- Command box -->
  <rect x="432" y="332" width="248" height="36" rx="8" fill="#f5f5ff"/>
  <text x="446" y="354" font-size="12.5" fill="#5865f2" font-weight="600">/return 札幌駅</text>
  <text x="432" y="397" font-size="11" fill="#555">→ 大学から目的駅までのルートを表示</text>

  <!-- Bottom note -->
  <text x="400" y="435" text-anchor="middle" font-size="11" fill="#aaa">これで使い方ガイドは以上です。ぜひご利用ください！</text>
</svg>
