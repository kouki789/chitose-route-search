<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Kaku Gothic ProN','YuGothic','Meiryo',sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#f9f9fb"/>
  <!-- Header bar -->
  <rect width="800" height="54" fill="#131e29"/>
  <text x="24" y="36" font-size="16" font-weight="800" fill="white">千歳ルート</text>
  <text x="107" y="36" font-size="16" font-weight="800" fill="#6366f1">検索</text>

  <!-- STEP badge -->
  <rect x="340" y="72" width="120" height="24" rx="12" fill="rgba(99,102,241,0.12)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 3 / 6</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" font-size="22" font-weight="900" fill="#111">検索ボタンを押す</text>

  <!-- Input field (filled) -->
  <rect x="160" y="145" width="360" height="48" rx="10" fill="white" stroke="#6366f1" stroke-width="2"/>
  <text x="182" y="175" font-size="14" font-weight="600" fill="#222">札幌駅</text>

  <!-- Search button -->
  <rect x="528" y="145" width="112" height="48" rx="10" fill="#6366f1"/>
  <text x="584" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="white">検索</text>

  <!-- Favorites button (active with star) -->
  <rect x="648" y="145" width="48" height="48" rx="10" fill="#fff8ec" stroke="#f5a623" stroke-width="2"/>
  <text x="672" y="176" text-anchor="middle" font-size="20" fill="#f5a623">★</text>

  <!-- Favorites label -->
  <text x="162" y="215" font-size="11" font-weight="600" fill="#999">お気に入り</text>

  <!-- Chip 1 -->
  <rect x="162" y="224" width="85" height="30" rx="15" fill="#fff8ec" stroke="#f5d08a" stroke-width="1"/>
  <text x="188" y="244" font-size="12" font-weight="600" fill="#333">札幌駅</text>
  <text x="239" y="244" font-size="11" fill="#ccc">×</text>

  <!-- Chip 2 -->
  <rect x="254" y="224" width="98" height="30" rx="15" fill="#fff8ec" stroke="#f5d08a" stroke-width="1"/>
  <text x="276" y="244" font-size="12" font-weight="600" fill="#333">千歳空港</text>
  <text x="343" y="244" font-size="11" fill="#ccc">×</text>

  <!-- Chip 3 -->
  <rect x="360" y="224" width="85" height="30" rx="15" fill="#fff8ec" stroke="#f5d08a" stroke-width="1"/>
  <text x="386" y="244" font-size="12" font-weight="600" fill="#333">苫小牧</text>
  <text x="436" y="244" font-size="11" fill="#ccc">×</text>

  <!-- Annotation: 検索ボタン -->
  <line x1="584" y1="196" x2="530" y2="276" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="430" y="280" width="215" height="90" rx="10" fill="white" stroke="#e0e0f5" stroke-width="1.5"/>
  <rect x="430" y="280" width="215" height="5" rx="2" fill="#6366f1"/>
  <text x="537" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">「検索」ボタン</text>
  <text x="537" y="327" text-anchor="middle" font-size="11" fill="#555">入力後に押すとYahoo!路線情報</text>
  <text x="537" y="344" text-anchor="middle" font-size="11" fill="#555">をもとにルートを表示します</text>
  <text x="537" y="361" text-anchor="middle" font-size="10" fill="#888">※入力がない場合は無効</text>

  <!-- Annotation: ☆ボタン -->
  <line x1="672" y1="196" x2="700" y2="280" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- No room, put this annotation beside -->

  <!-- Annotation: お気に入り -->
  <line x1="300" y1="254" x2="280" y2="280" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="80" y="280" width="215" height="90" rx="10" fill="white" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="80" y="280" width="215" height="5" rx="2" fill="#f5a623"/>
  <text x="187" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">☆ お気に入りボタン</text>
  <text x="187" y="327" text-anchor="middle" font-size="11" fill="#555">★になるとお気に入り登録済み</text>
  <text x="187" y="344" text-anchor="middle" font-size="11" fill="#555">チップをタップでワンタップ入力</text>
  <text x="187" y="361" text-anchor="middle" font-size="10" fill="#888">（最大5件まで保存）</text>

  <!-- Bottom note -->
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#bbb">お気に入りはブラウザに保存されます（サーバー送信なし）</text>
</svg>
