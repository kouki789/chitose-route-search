<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Hiragino Kaku Gothic ProN','YuGothic','Meiryo',sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#f9f9fb"/>
  <!-- Header bar -->
  <rect width="800" height="54" fill="#131e29"/>
  <text x="24" y="36" font-size="16" font-weight="800" fill="white">千歳ルート</text>
  <text x="107" y="36" font-size="16" font-weight="800" fill="#6366f1">検索</text>
  <text x="760" y="36" font-size="12" fill="#888" text-anchor="end">使い方ガイド</text>

  <!-- STEP badge -->
  <rect x="340" y="72" width="120" height="24" rx="12" fill="rgba(99,102,241,0.12)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 1 / 6</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" font-size="22" font-weight="900" fill="#111">往路・復路を選ぶ</text>

  <!-- Direction toggle background -->
  <rect x="218" y="147" width="364" height="62" rx="11" fill="#f0f0f5"/>
  <!-- 往路 active -->
  <rect x="222" y="151" width="172" height="54" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="308" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#333">往路（行き）</text>
  <!-- 復路 inactive -->
  <text x="490" y="183" text-anchor="middle" font-size="15" font-weight="600" fill="#888">復路（帰り）</text>
  <!-- Active indicator dot -->
  <circle cx="222" cy="151" r="0"/>

  <!-- Dashed lines to explanation cards -->
  <line x1="310" y1="213" x2="240" y2="258" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="490" y1="213" x2="560" y2="258" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- 往路 explanation card -->
  <rect x="60" y="260" width="260" height="110" rx="12" fill="white" stroke="#e0e0f0" stroke-width="1.5"/>
  <rect x="60" y="260" width="260" height="6" rx="3" fill="#6366f1"/>
  <text x="190" y="296" text-anchor="middle" font-size="13" font-weight="800" fill="#333">往路（行き）を選ぶと</text>
  <text x="190" y="318" text-anchor="middle" font-size="12" fill="#555">出発地を入力して</text>
  <text x="190" y="337" text-anchor="middle" font-size="12" fill="#555">大学までのルートを検索</text>
  <text x="190" y="356" text-anchor="middle" font-size="11" fill="#888">例: 札幌駅 → 千歳科技大</text>

  <!-- 復路 explanation card -->
  <rect x="480" y="260" width="260" height="110" rx="12" fill="white" stroke="#e0e0f0" stroke-width="1.5"/>
  <rect x="480" y="260" width="260" height="6" rx="3" fill="#a5b4fc"/>
  <text x="610" y="296" text-anchor="middle" font-size="13" font-weight="800" fill="#333">復路（帰り）を選ぶと</text>
  <text x="610" y="318" text-anchor="middle" font-size="12" fill="#555">目的地を入力して</text>
  <text x="610" y="337" text-anchor="middle" font-size="12" fill="#555">大学からのルートを検索</text>
  <text x="610" y="356" text-anchor="middle" font-size="11" fill="#888">例: 千歳科技大 → 札幌駅</text>

  <!-- Bottom note -->
  <text x="400" y="415" text-anchor="middle" font-size="11" fill="#bbb">方向を切り替えると入力内容がリセットされます</text>
</svg>
